<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0d2a25">
<title>Visit form · Farm Visit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;800&family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3f0;--surface:#fff;--ink:#0d2a25;--mut:#56706a;--line:#d6e0db;--tint:#e1ebe6;
  --accent:#0f7a6c;--on-accent:#fff;--accent-s:#d5eee8;--yolk:#f4b324;
  --good:#17885a;--warn:#b87700;--bad:#cc3d33;--na:#7f908a;
  --good-s:#dcf2e7;--warn-s:#faedcc;--bad-s:#fadedb;--na-s:#e8eeeb;
  --f-body:"Atkinson Hyperlegible","Noto Sans Devanagari",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --f-disp:"Bricolage Grotesque","Atkinson Hyperlegible","Noto Sans Devanagari",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0a1613;--surface:#112320;--ink:#e5f1ed;--mut:#8fa9a1;--line:#21362f;--tint:#172b26;
    --accent:#4fd1bd;--on-accent:#04231d;--accent-s:#133b33;
    --good:#4cc98d;--warn:#e5ac2f;--bad:#f0746a;--na:#7f968e;
    --good-s:#12342a;--warn-s:#3a2d0c;--bad-s:#3c1a18;--na-s:#1a2b26}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);margin:0;letter-spacing:-.01em}
.mut{color:var(--mut)}

/* top */
.top{padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:12px}
.top .eggb{border:0;background:none;padding:0;width:44px;flex:none}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font:800 21px/1.1 var(--f-disp);letter-spacing:-.02em}
.top .ttl span{display:block;font-size:13.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px;display:grid;place-items:center}
.egg{display:block;width:100%;height:auto;overflow:visible}
.egg .shell{fill:var(--surface);stroke:var(--ink);stroke-width:3.5}
.egg .yolk{transition:transform .7s cubic-bezier(.2,1.5,.4,1),fill .4s}

/* rail */
.rail{display:flex;gap:2px;overflow-x:auto;padding:0 10px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:none;border:0;background:none;padding:12px 10px 11px;font-weight:700;font-size:14.5px;color:var(--mut);position:relative}
.rail button b{font:800 13px var(--f-disp);margin-right:6px;opacity:.65}
.rail button.on{color:var(--ink)}
.rail button.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:3px;border-radius:3px;background:var(--accent)}
.rail button.done b{color:var(--accent);opacity:1}

main{max-width:720px;margin:0 auto;padding:22px 16px calc(120px + env(safe-area-inset-bottom))}
.h1{font:800 31px/1.08 var(--f-disp);letter-spacing:-.025em;margin:0 0 6px}
.lead{margin:0 0 6px;color:var(--mut);max-width:46ch}
.sec{margin-top:28px}
.sec>h2{font:700 18px var(--f-disp);margin:0 0 12px}
.sec .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec .row h2{font:700 18px var(--f-disp)}
.note{font-size:13.5px;color:var(--mut);margin:10px 0 0}

/* tiles */
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:3px;min-height:76px;padding:11px 14px;border-radius:14px;border:1.5px dashed var(--line);background:transparent;position:relative;overflow:hidden;width:100%}
.tile.has{border:1px solid var(--line);background:var(--surface)}
.tile:active{transform:scale(.985)}
.tile .tl{font-size:13.5px;font-weight:700;color:var(--mut);line-height:1.2}
.tile .tv{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap;margin-top:auto}
.tile .tv b{font:700 20px/1 var(--f-disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .tv b.sm{font-size:16px}
.tile .tv i{font-style:normal;font-size:12.5px;color:var(--mut)}
.tile .tv em{font-style:normal;font-size:13.5px;color:var(--accent);font-weight:700}
.tile .ts{font-size:12.5px;color:var(--accent);font-weight:700}
.tile .tbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--tint)}
.tile .tbar s{display:block;height:100%;background:var(--accent);text-decoration:none}
.tile.wide{grid-column:1/-1}

.seg{display:flex;background:var(--tint);padding:4px;border-radius:14px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:12px;border-radius:11px;font-weight:700;color:var(--mut);font-size:15px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}

.fi{display:block;margin-bottom:12px}
.fi>span{display:block;font-size:14px;font-weight:700;color:var(--mut);margin:0 0 5px}
.fi input,.fi textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px 14px;font:inherit;font-size:15.5px}
.fi textarea{resize:vertical;min-height:92px;line-height:1.4}

.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px;line-height:1.1}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.full{width:100%}
.btn.grow{flex:1}
.btn[disabled]{opacity:.4}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:700;font-size:14.5px;color:var(--ink)}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.chip.acc{border-color:var(--accent);color:var(--accent)}

/* live readings */
.live{margin-top:30px;background:var(--tint);border-radius:20px;padding:16px}
.live h2{font:700 18px var(--f-disp);margin:0 0 4px}
.live>p{margin:0;color:var(--mut);font-size:14.5px}
.kgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.kc{background:var(--surface);border-radius:12px;padding:10px 12px;border-left:5px solid var(--na)}
.kc.ok{border-left-color:var(--good)}.kc.warn{border-left-color:var(--warn)}.kc.bad{border-left-color:var(--bad)}
.kc .kl{font-size:13px;color:var(--mut);line-height:1.2}
.kc .kv{font:800 20px/1.2 var(--f-disp);font-variant-numeric:tabular-nums;margin-top:2px}
.kc .kb{font-size:12.5px;color:var(--mut);line-height:1.25}
.kc .ks{font-size:12.5px;font-weight:700;margin-top:2px}
.kc.ok .ks{color:var(--good)}.kc.warn .ks{color:var(--warn)}.kc.bad .ks{color:var(--bad)}.kc.na .ks{color:var(--na)}
.kgrp{font:700 15px var(--f-disp);margin:18px 0 0;color:var(--ink)}

/* checklist */
.prog{margin:14px 0 4px;font-size:15px;color:var(--mut)}
.pbar{height:8px;border-radius:8px;background:var(--tint);margin-top:8px;overflow:hidden}
.pbar s{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .35s;text-decoration:none}
.ci{padding:14px 0;border-top:1px solid var(--line)}
.ci p{margin:0 0 10px;font-weight:700;font-size:16px;line-height:1.3}
.ci .crit{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;color:var(--bad);border:1px solid var(--bad);border-radius:99px;padding:0 7px;vertical-align:2px}
.rt{display:grid;grid-template-columns:repeat(4,1fr);border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.rt button{border:0;border-right:1px solid var(--line);background:transparent;padding:12px 0;font-weight:700;font-size:14.5px;color:var(--mut)}
.rt button:last-child{border-right:0}
.rt button.on.g{background:var(--good);color:#fff}.rt button.on.f{background:#d9a21b;color:#2a1d00}.rt button.on.p{background:var(--bad);color:#fff}.rt button.on.n{background:var(--na);color:#fff}

/* actions */
.arow{padding:14px 0;border-top:1px solid var(--line)}
.arow input{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px 13px;font:inherit;font-size:16px;margin-bottom:8px}
.arow .ag{display:flex;gap:8px}
.arow .ag .tile{min-height:0;padding:10px 12px;flex:1}
.arow .ag .tile .tv b{font-size:16px}
.arow .x{flex:none;width:46px;border:1.5px solid var(--line);background:transparent;border-radius:12px;color:var(--bad);font-size:18px}

/* sign */
.sum{display:flex;gap:18px;align-items:center;padding:6px 0 2px}
.sum .egg-l{width:104px;flex:none}
.sum .big{font:800 46px/1 var(--f-disp);letter-spacing:-.03em}
.sum .rt2{font-weight:700;margin-top:2px}
.sum .sm2{color:var(--mut);font-size:14.5px;margin-top:4px}
.ph-g{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px}.ph-t{position:relative;width:96px;height:96px;border-radius:14px;overflow:hidden;background:var(--tint)}.ph-t img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}.ph-x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:17px;line-height:26px;padding:0}.ph-add{width:96px;height:96px;border-radius:14px;border:2px dashed var(--line);background:var(--surface);font-size:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink)}.ph-add span{font-size:13px;font-weight:700}.ph-l{display:flex;width:100%;height:100%;align-items:center;justify-content:center;color:var(--mut)}
.sg{position:relative;height:178px;border:2px dashed var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.sg canvas{width:100%;height:100%;display:block;touch-action:none}
.sg .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-weight:700;pointer-events:none}
.sg.signed{border-style:solid}.sg.signed .ph{display:none}
.sgf{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-weight:700}
.agree{display:flex;gap:12px;align-items:flex-start;margin-top:24px;font-size:16px}
.agree input{width:24px;height:24px;accent-color:var(--accent);flex:none;margin-top:1px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bin{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bin .cnt{font:800 15px var(--f-disp);color:var(--mut);min-width:44px;text-align:center}

/* sheets */
.sh{position:fixed;inset:0;z-index:100;background:rgba(5,16,12,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sp{background:var(--surface);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:6px 20px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:rise .28s cubic-bezier(.2,.9,.2,1)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.grip{padding:8px 0 4px;display:grid;place-items:center;touch-action:none}
.grip i{width:44px;height:5px;border-radius:5px;background:var(--line)}
.shd{touch-action:none;text-align:center;padding-bottom:4px}
.shd h3{font:700 18px var(--f-disp)}
.shd p{margin:2px 0 0;color:var(--mut);font-size:14px}
.nv{text-align:center;margin-top:4px}
.nv b{font:800 56px/1.05 var(--f-disp);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.nv span{font-size:17px;color:var(--mut);margin-left:6px}
.nh{text-align:center;color:var(--accent);font-weight:700;font-size:14.5px;min-height:22px}
.nrow{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0}
.nb2{flex:none;width:54px;height:54px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:28px;line-height:1;color:var(--accent);font-weight:700}
.nb2:active{background:var(--accent-s)}
.wz{position:relative;display:flex;justify-content:center;align-items:center;gap:2px;height:240px;min-width:0}
.wband{position:absolute;left:-4px;right:-4px;top:96px;height:48px;border-radius:14px;background:var(--accent-s)}
.wc{position:relative;z-index:1;width:56px;height:240px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;padding:96px 0;box-sizing:border-box;overscroll-behavior:contain;touch-action:pan-y;outline:none;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 26%,#000 74%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 26%,#000 74%,transparent 100%)}
.wc::-webkit-scrollbar{display:none}
.wc>div{height:48px;line-height:48px;text-align:center;font:800 32px/48px var(--f-disp);scroll-snap-align:center;scroll-snap-stop:always;cursor:pointer;user-select:none;-webkit-user-select:none;font-variant-numeric:tabular-nums;will-change:transform}
.wdot{z-index:1;font:800 32px/1 var(--f-disp);width:14px;text-align:center;font-style:normal;padding-bottom:6px}
.nin{width:100%;border:2px solid var(--accent);border-radius:14px;padding:16px;font:800 34px var(--f-disp);text-align:center;background:var(--surface);color:var(--ink);margin:14px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 2px}
.srow{display:flex;gap:10px;margin-top:16px}
.lst{display:flex;flex-direction:column}
.li{display:flex;align-items:center;justify-content:space-between;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:15px 4px;font-size:17px;font-weight:700}
.li small{display:block;font-weight:400;color:var(--mut);font-size:14px}
.li i{font-style:normal;color:var(--accent);opacity:0;font-size:20px}
.li.on i{opacity:1}
.calh{display:flex;align-items:center;justify-content:space-between;margin:2px 0 8px}
.calh b{font:800 18px var(--f-disp)}
.calh button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:none;font-size:18px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:12.5px;color:var(--mut);padding:4px 0;font-weight:700}
.day{aspect-ratio:1;border:0;border-radius:50%;background:transparent;font:700 16px var(--f-body);color:var(--ink)}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day.sel{background:var(--accent);color:var(--on-accent)}
.day[disabled]{opacity:.25}
.hist{border-top:1px solid var(--line);padding:14px 0;display:flex;gap:14px}
.hist .egg-s{width:38px;flex:none}
.hist .hi{flex:1;min-width:0}
.hist b{display:block;font-weight:700}
.hist small{color:var(--mut);display:block}
.hist .hb{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hist .hb button{padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:none;font-weight:700;font-size:14px}
.hist .hb .d{color:var(--bad)}

/* report */
#rv{position:fixed;inset:0;z-index:200;background:#1d2623;display:flex;flex-direction:column}
.rvbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--surface);color:var(--ink);flex-wrap:wrap}
.rvbar b{font:800 17px var(--f-disp);display:block}
.rvbar small{color:var(--mut)}
.rvb{display:flex;gap:8px;flex-wrap:wrap}
.rvb .btn{padding:11px 14px;font-size:15px}
.rvpages{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px;align-items:center}
.rvpages canvas{width:min(100%,820px);height:auto;background:#fff;box-shadow:0 8px 28px rgba(0,0,0,.5);border-radius:3px}
#pa{display:none}
@media print{body>*:not(#pa){display:none!important}#pa{display:block}#pa img{width:100%;display:block;page-break-after:always}@page{size:A4;margin:0}}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:300;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.blk{scroll-margin-top:112px}
.blk+.blk{margin-top:46px;padding-top:34px;border-top:1px solid var(--line)}
.blk .h1{font-size:27px}
.rail button{padding:12px 11px 11px}
.pill{display:inline-block;font-weight:700;font-size:13px;border-radius:99px;padding:3px 11px;white-space:nowrap}
.pill.ok{background:var(--good-s);color:var(--good)}.pill.warn{background:var(--warn-s);color:var(--warn)}.pill.bad{background:var(--bad-s);color:var(--bad)}.pill.na{background:var(--na-s);color:var(--na)}
.ar{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.ar .al{min-width:0}.ar .al b{display:block;font-weight:700;line-height:1.25}.ar .al small{display:block;color:var(--mut);font-size:13px;line-height:1.3;margin-top:2px}
.ar .al .crit{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;color:var(--bad);border:1px solid var(--bad);border-radius:99px;padding:0 7px;vertical-align:2px}
.ar .rr{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ar .rr span.v{font:800 17px var(--f-disp);font-variant-numeric:tabular-nums}
.agh{font:700 15px var(--f-disp);margin:22px 0 0}
.bin .bs{display:flex;align-items:center;gap:10px;min-width:0}
.bin .bs b{font:800 22px var(--f-disp)}.bin .bs span{font-size:13px;color:var(--mut);line-height:1.15}

#hd{position:relative;z-index:30;background:var(--bg)}
.vtabs{display:flex;gap:6px;padding:0 16px 10px}
.vtabs button{flex:1;padding:10px 8px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-weight:700;font-size:15px}
.vtabs button.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.nobar .bar{display:none}.nobar main{padding-bottom:48px}.nobar .rail{display:none}
body.wide main{max-width:1680px}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.sumg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:22px}
@media(min-width:640px){.sumg{grid-template-columns:repeat(4,1fr)}}
.sumg .kc .kv{font-size:22px}
.cc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;margin-top:12px}
.cc .ctl{font:700 15px var(--f-disp);margin:0 0 6px}
.cc svg{width:100%;height:auto;display:block}
.cc svg text{font-family:var(--f-body)}
.cc .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13.5px}
.cc .legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.bar-ok{fill:var(--good)}.bar-warn{fill:var(--warn)}.bar-bad{fill:var(--bad)}.bar-na{fill:var(--na)}
.tw{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.tw table{border-collapse:collapse;width:100%;min-width:460px;font-size:14.5px}
.tw th,.tw td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}

:root{--bg:#edf2f0;--line:#dce5e2;--glow:rgba(244,179,36,.16);--accent:#0b7466;--accent-s:#d4efe9;

function lineChart(series,dec){
  const W=680,H=300,L=58,Rr=16,T=14,B=38;
  const pts=series.reduce((a,s)=>a.concat(s.pts),[]);if(!pts.length)return'';
  const vals=pts.map(p=>p.v);let lo=Math.min(...vals),hi=Math.max(...vals);const lo0=lo;
  if(lo===hi){lo-=1;hi+=1}const pd=(hi-lo)*.14;lo-=pd;hi+=pd;if(lo<0&&lo0>=0)lo=0;
  const ds=pts.map(p=>parse(p.d).getTime()),d0=Math.min(...ds),d1=Math.max(...ds);
  const X=d=>d1===d0?(L+W-Rr)/2:L+(parse(d).getTime()-d0)/(d1-d0)*(W-L-Rr);
  const Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const td=hi-lo<2?2:hi-lo<20?1:0;let g='';
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);g+=`<line x1="${L}" x2="${W-Rr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="16" fill="var(--mut)">${(+v.toFixed(td)).toLocaleString()}</text>`}
  const dl=t=>{const d=new Date(t);return d.getDate()+' '+MON[d.getMonth()]};
  [d0,(d0+d1)/2,d1].forEach((t,i)=>{if(d0===d1&&i!==1)return;const x=d1===d0?X(pts[0].d):L+(t-d0)/(d1-d0)*(W-L-Rr);g+=`<text x="${x.toFixed(1)}" y="${H-10}" text-anchor="${i===0&&d0!==d1?'start':i===2?'end':'middle'}" font-size="16" fill="var(--mut)">${dl(t)}</text>`});
  series.forEach((s,i)=>{
    const c=SCOL[i%SCOL.length],p=s.pts.slice().sort((a,b)=>a.d<b.d?-1:1);
    if(p.length>1)g+=`<polyline fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${p.map(q=>X(q.d).toFixed(1)+','+Y(q.v).toFixed(1)).join(' ')}"/>`;
    p.forEach(q=>{g+=`<circle cx="${X(q.d).toFixed(1)}" cy="${Y(q.v).toFixed(1)}" r="4.5" fill="var(--surface)" stroke="${c}" stroke-width="2.5"><title>${esc(s.name)}, ${fmtDate(q.d)}: ${esc(q.t)}</title></circle>`});
  });
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart">${g}</svg>`;
}
function barChart(rows){
  const W=680,rh=44,L=190,Rr=96,H=rows.length*rh+10;
  const vals=rows.map(r=>r.raw),mx=Math.max(0,...vals),mn=Math.min(0,...vals),span=(mx-mn)||1;
  const X=v=>L+(v-mn)/span*(W-L-Rr),z=X(0);let g='';
  rows.forEach((r,i)=>{
    const y=i*rh+6,x0=Math.min(z,X(r.raw)),w=Math.max(3,Math.abs(X(r.raw)-z));
    const nm=r.name.length>22?r.name.slice(0,21)+'…':r.name;

  });
  g+=`<line x1="${z.toFixed(1)}" x2="${z.toFixed(1)}" y1="0" y2="${H}" stroke="var(--mut)" stroke-width="1"/>`;
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Comparison by farm">${g}</svg>`;
}

function rnd(seed){let x=seed;return()=>{x=(x*1664525+1013904223)%4294967296;return x/4294967296}}

    const jit=(x,sp,a,b)=>cl(Math.round(x+(R()-.5)*sp),a,b);
    for(let k=0;k<6;k++){
      const age=ageB-k*gap;if(age<7)break;
      const date=addDays(today(),-k*gap-(fi%3));
      const v=newDraft();v.id='demo-'+f.id+'-'+k;
      Object.keys(f).forEach(x=>{if(x!=='id'&&x!=='obs'&&x!=='recs')v[x]=typeof f[x]==='number'?S(f[x]):f[x]});
      v.farmId=f.id;v.date=date;v.age=S(age);v.hatch=addDays(date,-age);
      v.auditor=AUDITORS[(fi+k)%3].n;v.org=AUDITORS[(fi+k)%3].o;
      if(k>0){
        const prog=age/ageB;
        const dead=Math.round((f.placed-f.alive)*Math.pow(prog,1.4)*(.92+R()*.16));
        v.alive=S(f.placed-dead);v.mortw=S(Math.max(0,Math.round(f.mortw*(.5+R()))));
        v.wt=S(Math.round(interp(T.w,age)*wr*(.97+R()*.06)));
        const al=num(v.alive),gpb=interp(T.f,age)*fr*(.97+R()*.06);
        v.feed=S(+(al*gpb/1000).toFixed(1));
        v.water=S(Math.round(num(v.feed)*(f.water/f.feed)*(.95+R()*.1)));
        v.stock=S(Math.round(num(v.feed)*(f.stock/f.feed)*(.8+R()*.5)));
        v.cumfeed=S(+(cumFeed(T.f,age)*(f.cumfeed/cumFeed(T.f,ageB))).toFixed(2));
        v.prevwt=S(Math.round(interp(T.w,age-gap)*wr));v.prevdays=S(gap);v.prevdate=addDays(date,-gap);
        v.unif=S(jit(f.unif,6,55,95));
        v.temp=S(Math.round((f.temp+(R()-.5)*3)*2)/2);v.hum=S(jit(f.hum,8,35,90));
        if(f.type==='Layer'&&lr0>0&&age>=126){
          const lr=cl(interp(T.l,age)*lr0*(.97+R()*.06),0,99);v.eggs=S(Math.round(al*lr/100));
          v.broken=S(Math.round(num(v.eggs)*(f.broken/f.eggs)*(.7+R()*.6)));v.cumeggs=S(Math.round(f.cumeggs*Math.pow(prog,1.5)));
        }else{v.eggs='0';v.broken='0';v.cumeggs='0'}
        v.bio=S(jit(f.bio,2,0,6));v.rodents=S(jit(f.rodents,3,0,99));v.carcass=S(jit(f.carcass,2,0,99));
        v.nh3=S(jit(f.nh3,6,2,60));v.litter=S(jit(f.litter,8,10,70));v.waste=S(jit(f.waste,3,0,30));v.bpd=S(jit(f.bpd,3,4,40));
        const vd=Math.max(1,Math.round(f.vdue*prog));v.vdue=S(vd);v.vdone=S(Math.max(0,vd-(f.vdue>f.vdone?Math.round(R()*(f.vdue-f.vdone+1)):0)));
        v.wdraw=S(f.wdraw?Math.round(R()*2):0);
        const sk=jit(f.sick,f.sick*.6,0,9999);v.sick=S(sk);v.isol=S(Math.min(sk,Math.round(sk*(f.isol/Math.max(1,f.sick))*(.8+R()*.3))));
        v.gaps=S(jit(f.gaps,2,0,7));v.nobill=S(jit(f.nobill,2,0,99));
      }
      stdFields(v);
      v.no='FV-'+date.replace(/-/g,'')+'-'+pad(fi+1);
      v.savedAt=date+'T10:00:00';v.critical='';v.actions=[];
      autoFlagOn(v);suggestOn(v);
      v.actions.forEach((a,i)=>{a.done=k>=2||(k===1&&i%2===0)});
      v.obs=k===0?f.obs:'Routine follow-up visit. Figures recorded.';v.recs=k===0?f.recs:'';
      out.push(v);
    }
  });
  return out;
}

/* ================= signatures ================= */
let sigDirty=false;
/* Signatures are kept small (the sheet takes about 40,000 characters per signature): redraw at
   screen size, at most 600 px wide, and shrink further if a busy signature is still too big. */
function sigPng(c){
  let w=Math.min(600,c.clientWidth||c.width),h=Math.round(w*c.height/c.width),out='';
  for(let i=0;i<4;i++){const t=document.createElement('canvas');t.width=w;t.height=h;t.getContext('2d').drawImage(c,0,0,w,h);out=t.toDataURL('image/png');if(out.length<38000)break;w=Math.round(w*.75);h=Math.round(h*.75)}
  return out;
}
function initSig(boxId,key){
  const box=$('#'+boxId),c=$('canvas',box);if(!c)return;
  const r=box.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
  c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);
  const x=c.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2.8;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#0b1f1a';x.fillStyle='#0b1f1a';
  if(D[key]){const im=new Image();im.onload=()=>x.drawImage(im,0,0,r.width,r.height);im.src=D[key];box.classList.add('signed')}
  let down=false,pts=[];
  const pos=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  c.addEventListener('pointerdown',e=>{e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(_){}down=true;pts=[pos(e)];box.classList.add('signed');x.beginPath();x.arc(pts[0][0],pts[0][1],1.4,0,7);x.fill()});
  c.addEventListener('pointermove',e=>{if(!down)return;const p=pos(e);pts.push(p);const n=pts.length;if(n<3)return;const a=pts[n-3],b=pts[n-2];x.beginPath();x.moveTo((a[0]+b[0])/2,(a[1]+b[1])/2);x.quadraticCurveTo(b[0],b[1],(b[0]+p[0])/2,(b[1]+p[1])/2);x.stroke()});
  const end=()=>{if(!down)return;down=false;D[key]=sigPng(c);sigDirty=false;saveDraft();renderRail()};
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
}

   so a new auditor can try the form, Live readings and the PDF without typing. It saves only when they press Save visit. */

function demoSig(){
  [['sgA','sigA',D.auditor],['sgF','sigF',D.farmer]].forEach(([id,key,name])=>{
    const box=$('#'+id);if(!box)return;const r=box.getBoundingClientRect(),dpr=2;
    const c=document.createElement('canvas');c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);
    const x=c.getContext('2d');x.scale(dpr,dpr);x.fillStyle='#0b1f1a';x.strokeStyle='#0b1f1a';x.lineWidth=2.6;x.lineCap='round';
    const nm=name||'Signed';let fs=r.height*.36;
    do{x.font='italic 700 '+fs+'px "Segoe Script","Brush Script MT","Snell Roundhand","Lucida Handwriting",cursive';fs-=2}while(x.measureText(nm).width>r.width*.8&&fs>12);
    x.save();x.translate(r.width*.08,r.height*.58);x.rotate(-.05);x.fillText(nm,0,0);x.restore();

/* ================= findings helpers ================= */
function flagLinesOn(d){const K=kpis(d),C=compliance(d,K);return{crit:C.poorCrit,poor:C.poor,kb:K.filter(k=>k.st==='bad'&&!C.critKpis.includes(k.label))}}
function autoFlagOn(d){
  const f=flagLinesOn(d),lines=[];
  f.crit.forEach(x=>lines.push('Critical: '+x));
  f.kb.forEach(k=>lines.push(k.label+' is '+k.val+' (target: '+k.bench.toLowerCase()+')'));
  const cur=(d.critical||'').trim(),add=lines.filter(l=>!cur.includes(l));
  if(add.length)d.critical=(cur?cur+'\n':'')+add.map(l=>'• '+l).join('\n');
  return{lines:lines.length,added:add.length};
}
function suggestOn(d){
  const f=flagLinesOn(d),have=(d.actions||[]).map(a=>a.what),out=[],base=d.date||today();
  const push=(what,who,days)=>{if(!have.includes(what)&&!out.some(o=>o.what===what))out.push({what,who,due:addDays(base,days),done:false})};
  f.crit.forEach(x=>push('Fix: '+x,'Farmer',3));
  f.poor.forEach(x=>push('Improve: '+x,'Farmer',7));
  f.kb.forEach(k=>push('Review '+k.label.toLowerCase()+', now '+k.val,'Farm manager',14));
  const add=out.slice(0,8);d.actions=(d.actions||[]).concat(add);return add.length;
}

function openPreview(R,no,fname,title){
  closeReport();REP={R};
  const canShare=!!(navigator.canShare&&navigator.share);
  const o=document.createElement('div');o.id='rv';
  o.innerHTML=`<div class="rvbar"><div><b>${esc(no||'Report')}</b><small>${R.pages.length} page${R.pages.length>1?'s':''}, ready as PDF</small></div><div class="rvb"><button class="btn pri" data-r="dl">Download PDF</button>${canShare?'<button class="btn ghost" data-r="share">Share</button>':''}<button class="btn ghost" data-r="print">Print</button><button class="btn ghost" data-r="x" aria-label="Close">✕</button></div></div><div class="rvpages"></div>`;
  const box=$('.rvpages',o);R.pages.forEach(c=>box.appendChild(c));
  document.body.appendChild(o);document.body.style.overflow='hidden';
  const mk=()=>new Blob([buildPDF(R.pages,title)],{type:'application/pdf'});
  o.addEventListener('click',async e=>{
    const b=e.target.closest('[data-r]');if(!b)return;
    if(b.dataset.r==='x')closeReport();
    else if(b.dataset.r==='dl'){download(fname,mk());toast('PDF downloaded')}
    else if(b.dataset.r==='share'){try{const f=new File([mk()],fname,{type:'application/pdf'});if(navigator.canShare({files:[f]}))await navigator.share({files:[f],title});else toast('Sharing files is not supported here. Use Download PDF.')}catch(err){if(err&&err.name!=='AbortError')toast('Sharing failed. Use Download PDF.')}}
    else if(b.dataset.r==='print'){const pa=$('#pa');pa.innerHTML='';R.pages.forEach(c=>{const im=new Image();im.src=c.toDataURL('image/jpeg',0.9);pa.appendChild(im)});setTimeout(()=>{window.print()},250)}
  });
}
async function showReport(v){
  toast('Preparing report');
  let R;try{R=await buildReport(v)}catch(err){console.error(err);toast('Could not build the report. Try again.');return}
  const fname='Farm-Visit-'+(v.no||'report')+(v.farm?'-'+v.farm.replace(/[^\w]+/g,'-').replace(/^-|-$/g,''):'')+'.pdf';
  openPreview(R,v.no,fname,'Farm visit report '+(v.no||''));
}
function openSaved(v){
  const C=compliance(v);
  const el=sheet('Visit saved',`<p style="text-align:center;margin:6px 0 4px;color:var(--mut)">${esc(v.no)} for ${esc(v.farm)} is saved with an audit score of ${C.pct==null?'n/a':C.pct.toFixed(0)+'%'}. Its findings and the PDF report are in the Reports tab.</p><div class="srow"><button class="btn ghost grow" id="svs">Stay here</button><button class="btn pri grow" id="svr">Open findings</button></div>`);
  $('#svs',el).onclick=()=>closeSheet();
  $('#svr',el).onclick=()=>{closeSheet();RP.sel=v.id;RP.ff='all';RP.page='findings';saveRP();setView('reports')};
}
function toEntry(i){if(view!=='entry')setView('entry');setTimeout(()=>jump(i),80)}
async function saveVisit(){
  const miss=[];
  if(!D.auditor.trim())miss.push('the auditor');
  if(!D.farmer.trim())miss.push('the farmer');
  if(miss.length){toEntry(0);toast('Choose '+miss.join(' and ')+' first.');return}
  const rq=CF.filter(f=>f.required&&cfOn(f)&&!has(D[f.id]));
  if(rq.length){toEntry(stepIdx('custom'));toast('Fill in '+rq.map(f=>f.label).join(', ')+' to save.');return}
  if(!D.sigA)miss.push('the auditor signature');
  if(!D.sigF)miss.push('the farmer signature');
  if(miss.length){toEntry(stepIdx('sign'));toast('Add '+miss.join(' and ')+' to save the visit.');return}
  if(!D.no){const same=VIS.filter(v=>v.date===D.date).length;D.no='FV-'+D.date.replace(/-/g,'')+'-'+pad(same+1)}
  if(!(D.critical||'').trim()&&!D.actions.length){autoFlagOn(D);suggestOn(D)}
  D.savedAt=new Date().toISOString();ST.auditor=D.auditor;ST.org=D.org;lsSet(KS,ST);
  const snap=JSON.parse(JSON.stringify(D));
  saveNow();queueSave(snap);
  openSaved(snap);
}

function trStrict(c){
  let r=HI[c];if(r==null)r=LCMAP[c.toLowerCase()];
  if(r==null){const b=c.match(/^([•\-]\s+)([\s\S]+)$/);if(b)r=b[1]+trCore(b[2])}
  if(r==null){for(const [rx,fn] of RX){const m=c.match(rx);if(m){const o=fn(m);if(o!=null){r=o;break}}}}
  return r;
}
function trCore(c){
  if(CACHE.has(c))return CACHE.get(c);
  let r=trStrict(c);
  if(r==null&&c.indexOf(', ')>0){const pp=c.split(', '),ps=pp.map(trStrict);if(ps.some(x=>x!=null))r=pp.map((q,i)=>ps[i]!=null?ps[i]:(q.indexOf(', ')<0&&PHs(q))).join(', ')}
  if(r==null){let t=c;PH.forEach(([a,b])=>{t=t.replace(a,b)});r=t}
  CACHE.set(c,r);return r;
}
function tr(s){
  if(s==null||LANG()==='en')return s;
  s=String(s);if(!/[A-Za-z]{2}/.test(s))return s;
  if(s.indexOf('\n')>=0)return s.split('\n').map(tr).join('\n');
  const m=s.match(/^(\s*)([\s\S]*?)(\s*)$/);if(!m[2])return s;

}

function xlAttrs(el){

  const r=await fetch(url,{method,credentials:'same-origin',headers:Object.assign({'X-FV':'1'},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});
  if(r.status===401){location.href='/login';const e=new Error('auth');e.status=401;throw e}

async function flush(){
  if(flushing||!ST.uid)return;flushing=true;
  try{
    for(;;){
      const id=Object.keys(OB)[0];if(!id)break;
      const v=OB[id];
      try{
        if(!(await withSigs(v)))break;
        const data=Object.assign({},v);delete data.userId;
        const r=await api('PUT','/api/visits/'+id,{data,summary:summaryOf(v)});
        if(r&&(r.photos||r.selfie))applyPhotoRefs(id,v,r);
        const cur=VIS.find(x=>x.id===id);
        if(cur&&r.farmId){cur.farmId=r.farmId;if(D.id===id)D.farmId=r.farmId}
        if(r.farmId&&!DEMO.some(f=>f.id===r.farmId)){try{const f=await api('GET','/api/farms');DEMO=Array.isArray(f)?f:(f.farms||DEMO)}catch(_){}}
        if(OB[id]===v){delete OB[id];lsSet(OBK(),OB)}
      }catch(e){
        if(e.message==='auth')return;
        if(!e.status||e.status>=500)break;
        toast('Report '+(v.no||'')+' could not be saved: '+e.message);delete OB[id];lsSet(OBK(),OB);

    }

}

  KS='fv_settings_'+u.id;KD='fv_draft_'+u.id;
  ST=Object.assign({},ST0,lsGet(KS,{}));
  ST.uid=u.id;ST.me=u.name;ST.role=u.role==='auditor'?'auditor':'admin';ST.roleName={owner:'Owner',admin:'Admin',auditor:'Auditor',viewer:'Viewer'}[u.role]||'';ST.realRole=u.role;
  ST.orgName=b.org.name;ST.cur=b.org.currency||'₹';ST.org=ST.org||u.orgLabel||b.org.name;
  if(ST.lang===undefined&&['en','hi','dv'].includes(b.org.language))ST.lang=b.org.language;
  lsSet(KS,ST);
  AUDITORS=(u.role==='auditor'?[{name:u.name,orgLabel:u.orgLabel}]:b.auditors).map(a=>({n:a.name,o:a.orgLabel||b.org.name}));
  DEMO=b.farms||[];
  VIS=(b.visits||[]).map(v=>Object.assign({},v.data,{id:v.id,farmId:v.farmId||'',userId:v.userId,no:v.data.no||v.no}));
  OB=lsGet(OBK(),{});
  Object.keys(OB).forEach(id=>{const i=VIS.findIndex(x=>x.id===id);if(i>=0)VIS[i]=OB[id];else VIS.push(OB[id])});
  applyConfig(b.config);CFG.version=b.config.version;
  D=Object.assign(newDraft(),lsGet(KD,{}));
  if(!D.auditor)D.auditor=ST.auditor||ST.me;
  renderAll();scrolled();xlTree(document.body);langBtn();
  flush();
}
