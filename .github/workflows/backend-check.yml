name: Backend check

# Run by hand (Actions → Backend check → Run workflow) to see whether the
# Google Sheet backend answers. It only reads; nothing is changed.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the backend
        run: |
          URL=$(curl -sS https://tarkeshstack.github.io/farmvisit/index.html | grep -o 'https://script.google.com/macros/s/[^"]*/exec' | head -1)
          echo "Backend: $URL"
          echo "--- GET (plain visit) ---"
          curl -sSL -m 60 "$URL" | head -c 600; echo
          echo "--- POST /api/auth/status ---"
          curl -sSL -m 60 -H 'Content-Type: text/plain;charset=utf-8' --data '{"m":"GET","p":"/api/auth/status","t":"","b":{}}' "$URL" | head -c 600; echo
          for U in testviewer testauditor testadmin; do
            echo "--- sign in as $U and load data ---"
            APP=reports; [ $U = testadmin ] && APP=admin
            TOK=$(curl -sSL -m 60 -H 'Content-Type: text/plain;charset=utf-8' --data "{\"m\":\"POST\",\"p\":\"/api/auth/login\",\"t\":\"\",\"b\":{\"email\":\"$U\",\"password\":\"FarmTest1\",\"app\":\"$APP\"}}" "$URL" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["d"].get("token","") or "LOGIN FAILED: "+json.dumps(d))')
            case "$TOK" in LOGIN*) echo "$TOK"; continue;; esac
            curl -sSL -m 90 -H 'Content-Type: text/plain;charset=utf-8' --data "{\"m\":\"GET\",\"p\":\"/api/bootstrap\",\"t\":\"$TOK\",\"b\":{}}" "$URL" | python3 -c 'import sys,json;d=json.load(sys.stdin);b=d.get("d",{});print("status",d.get("s"),"| role",b.get("user",{}).get("role"),"| farms",len(b.get("farms",[])),"| visits",len(b.get("visits",[])),"|",(b.get("error") or ""))'
          done
