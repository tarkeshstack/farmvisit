name: Photo check

# Run by hand (Actions → Photo check → Run workflow) after updating Code.gs, to confirm photos
# reach Google Drive. It saves one test visit with a tiny photo as testauditor, reads the photo
# back, then deletes the test visit (and with it the photo).
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Save, read back and delete a test photo
        run: |
          URL=$(curl -sS https://tarkeshstack.github.io/farmvisit/index.html | grep -o 'https://script.google.com/macros/s/[^"]*/exec' | head -1)
          post() { curl -sSL -m 120 -H 'Content-Type: text/plain;charset=utf-8' --data "$1" "$URL"; }
          TOK=$(post '{"m":"POST","p":"/api/auth/login","t":"","b":{"email":"testauditor","password":"FarmTest1","app":"form"}}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["d"]["token"])')
          ID="phototest-$(date +%s)"
          PHOTO="data:image/jpeg;base64,"
          BODY=$(python3 -c 'import json,sys;print(json.dumps({"m":"PUT","p":"/api/visits/"+sys.argv[1],"t":sys.argv[2],"b":{"data":{"date":"2026-10-25","no":"PHOTO-TEST","farm":"Green Acres","farmer":"Ravi Kumar","type":"Layer","auditor":"Test Auditor","photos":[{"d":sys.argv[3]}]},"summary":{}}}))' "$ID" "$TOK" "$PHOTO")
          echo "--- save visit with photo ---"; SAVE=$(post "$BODY"); echo "$SAVE" | head -c 400; echo
          FID=$(echo "$SAVE" | python3 -c 'import sys,json;d=json.load(sys.stdin)["d"];print((d.get("photos") or [{}])[0].get("f",""))')
          if [ -z "$FID" ]; then echo "RESULT: photo was NOT stored (is the new Code.gs deployed and Drive allowed via setup?)"; fi
          if [ -n "$FID" ]; then echo "--- read photo back ---"; post "{\"m\":\"GET\",\"p\":\"/api/photos/$FID\",\"t\":\"$TOK\",\"b\":{}}" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("status",d["s"],"| bytes",len((d["d"] or {}).get("src","")),"|",(d["d"] or {}).get("error",""))'; fi
          echo "--- delete test visit ---"; post "{\"m\":\"DELETE\",\"p\":\"/api/visits/$ID\",\"t\":\"$TOK\",\"b\":{}}" | head -c 200; echo
          [ -n "$FID" ] && echo "RESULT: photos work"
