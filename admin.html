<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin console · Farm Visit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf2f0;--surface:#fff;--ink:#0d2a25;--mut:#56706a;--line:#d6e0db;--tint:#e1ebe6;--accent:#0b7466;--accent-s:#d4efe9;--on-accent:#fff;--yolk:#f4b324;
 --good:#17885a;--warn:#b87700;--bad:#cc3d33;--good-s:#dcf2e7;--warn-s:#faedcc;--bad-s:#fadedb;--na:#7f908a;
 --sh:0 1px 2px rgba(10,40,34,.06),0 6px 16px rgba(10,40,34,.06);
 --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--f-disp:"Bricolage Grotesque","Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#09130f;--surface:#112320;--ink:#e5f1ed;--mut:#8fa9a1;--line:#21362f;--tint:#172b26;--accent:#4fd1bd;--accent-s:#133b33;--on-accent:#04231d;
 --good:#4cc98d;--warn:#e5ac2f;--bad:#f0746a;--good-s:#12342a;--warn-s:#3a2d0c;--bad-s:#3c1a18;--sh:0 1px 2px rgba(0,0,0,.5),0 6px 16px rgba(0,0,0,.28)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px}
.brand svg{width:26px;height:30px;flex:none;color:var(--ink)}
.brand b{font:800 19px/1 var(--f-disp)}
.brand small{display:block;color:var(--mut);font-size:12px;margin-top:2px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.side a.nv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--mut);text-decoration:none;font-weight:700;font-size:15px}
nav.side a.nv:hover{background:var(--tint);color:var(--ink)}
nav.side a.nv[aria-current=page]{background:var(--accent-s);color:var(--accent)}
nav.side .sp{flex:1}
nav.side .me{padding:12px 8px 0;border-top:1px solid var(--line);font-size:14px;color:var(--mut)}
nav.side .me b{display:block;color:var(--ink)}
nav.side .me a{display:inline-block;margin:6px 10px 0 0;font-weight:700;font-size:14px}
main{padding:28px clamp(16px,4vw,44px) 120px;max-width:1180px;width:100%}
h1{font:800 clamp(26px,3.4vw,34px)/1.1 var(--f-disp);margin:0 0 4px;letter-spacing:-.01em}
h2{font:800 20px/1.2 var(--f-disp);margin:30px 0 10px}
h3{font:800 16px/1.2 var(--f-disp);margin:22px 0 8px}
.lead{margin:0 0 22px;color:var(--mut);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
.pad{padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:8px}
.stat{padding:16px 18px}
.stat b{display:block;font:800 30px/1.1 var(--f-disp)}
.stat span{color:var(--mut);font-size:14px}
.tw{overflow:auto;border-radius:18px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-weight:700;color:var(--mut);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:14px}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td small{display:block;color:var(--mut);font-size:13px}
tr.grp td{background:var(--tint);font-weight:800;font-size:14px;padding:7px 14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.55;cursor:default}
.lnk{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:4px 6px;border-radius:8px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.row.sp{justify-content:space-between}
.seg{display:inline-flex;padding:4px;gap:2px;background:var(--tint);border-radius:14px}
.seg button{border:0;background:transparent;color:var(--mut);font-weight:700;padding:8px 16px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--tint);color:var(--mut)}
.pill.ok{background:var(--good-s);color:var(--good)}.pill.warn{background:var(--warn-s);color:var(--warn)}.pill.bad{background:var(--bad-s);color:var(--bad)}
.egg{width:22px;height:25px;vertical-align:middle;margin-right:8px}
.egg .shell{fill:none;stroke:var(--ink);stroke-width:7;opacity:.85}
.sc{display:inline-flex;align-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.mbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--tint);min-width:110px}
.mbar i{display:block}.mbar .o{background:var(--good)}.mbar .w{background:var(--yolk)}.mbar .b{background:var(--bad)}
.empty{padding:34px 18px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink);font:800 18px var(--f-disp);margin-bottom:4px}
/* metrics list */
.mlist{display:flex;flex-direction:column}
.mr{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}
.mr:last-child{border-bottom:0}
.mr .mn b{display:block}.mr .mn small{color:var(--mut);font-size:13px}
.mr.off .mn{opacity:.5}
.lim{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:6px 0 4px}
.lim label{font-size:13px;font-weight:700;color:var(--mut)}
.lim input{display:block;width:96px;margin-top:3px}
.sw{position:relative;display:inline-block;width:44px;height:26px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked+i{background:var(--accent)}.sw input:checked+i:after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
input[type=text],input[type=email],input[type=number],input[type=password],input:not([type]),select,textarea{padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);width:100%}
input.er{border-color:var(--bad);background:var(--bad-s)}
textarea{resize:vertical;min-height:84px}
label.f{display:block;font-weight:700;font-size:14px;margin:0 0 12px}
label.f>span{display:block;margin-bottom:4px}
label.f small{font-weight:400;color:var(--mut);display:block;margin-top:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.chk{display:inline-flex;align-items:center;gap:7px;margin-right:16px;font-weight:700;font-size:15px}
.chk input{width:18px;height:18px;margin:0}
/* cards list */
.items{display:grid;gap:10px}
.it{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;padding:14px 16px}
.it b{font-size:16px}.it .m{color:var(--mut);font-size:14px}
.it code,code.fx{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--tint);padding:2px 7px;border-radius:7px;word-break:break-word}
/* dialog */
dialog{border:0;border-radius:20px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:var(--surface);color:var(--ink);box-shadow:0 24px 70px rgba(0,0,0,.35)}
dialog.wide{width:min(760px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(5,20,16,.55)}
.dh{padding:18px 22px 6px}.dh h2{margin:0}
.db{padding:10px 22px;overflow:auto;max-height:calc(100vh - 190px)}
.df{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.derr{display:none;margin:0 0 12px;padding:9px 12px;border-radius:10px;background:var(--bad-s);color:var(--bad);font-weight:700;font-size:14px}.derr.on{display:block}
.vars{display:flex;flex-wrap:wrap;gap:6px;max-height:130px;overflow:auto;padding:2px}
.vars button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:3px 10px;font:13px ui-monospace,Menlo,monospace;cursor:pointer}
.vars button:hover{border-color:var(--accent);color:var(--accent)}
.try{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 10px;margin-top:8px}
.try label{font-size:12px;font-weight:700;color:var(--mut)}
.res{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--tint);font-weight:700}
.hint{color:var(--mut);font-size:14px}
.pw{font:800 22px ui-monospace,Menlo,monospace;letter-spacing:.04em;padding:14px;border-radius:12px;background:var(--tint);text-align:center;user-select:all;word-break:break-all}
/* save bar + toast */
#bar{position:fixed;left:230px;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:12px 16px;pointer-events:none;transform:translateY(120%);transition:transform .2s}
#bar.on{transform:none}
#bar div{pointer-events:auto;display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--bg);padding:10px 12px 10px 18px;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.35);font-weight:700}
#bar .btn{border-color:transparent}
#toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);opacity:0;z-index:50;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;pointer-events:none;transition:.2s;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.top{display:none}
@media (max-width:860px){
 .app{display:block}
 nav.side{position:sticky;top:0;z-index:15;height:auto;flex-direction:row;align-items:center;gap:4px;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
 .brand,nav.side .sp,nav.side .me{display:none}
 nav.side a.nv{padding:8px 12px;flex:none}
 .top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0;font-size:14px;color:var(--mut)}
 #bar{left:0}
 .g2{grid-template-columns:1fr}
 main{padding-top:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
 <nav class="side" id="nav" aria-label="Admin sections"></nav>
 <div>
  <div class="top" id="top"></div>
  <main id="view" tabindex="-1"><p class="hint">Loading…</p></main>
 </div>
</div>
<div id="bar" role="region" aria-label="Unsaved changes"><div><span>You have unsaved changes</span><button class="btn sm" id="discard">Discard</button><button class="btn sm pri" id="save">Save changes</button></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>/* Shared between the server, the farm visit app and the admin panel.
   Single source of truth for: built-in KPI catalogue, baseline (threshold) engine,
   input-field catalogue and the safe formula engine used by custom KPIs. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.FV = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
  const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };

  /* ---------- groups ---------- */
  const G1 = 'Mortality and health', G2 = 'Growth and weight', G3 = 'Feed and water',
        G4 = 'Egg production', G5 = 'Costs and profit', G6 = 'House conditions',
        GA = 'Audit checks', GC = 'Custom metrics';
  const GROUPS = [G1, G2, G3, G4, G5, G6];
  const TYPES = ['Broiler', 'Layer'];

  /* ---------- built-in KPI catalogue (labels exactly as produced by kpis()) ---------- */
  const BUILTIN = [
    [G1, 'Total mortality'], [G1, 'Livability'], [G1, 'Deaths in the last 7 days'],
    [G2, 'Body weight'], [G2, 'Weight against standard'], [G2, 'Daily gain, whole life'],
    [G2, 'Gained since last weighing'], [G2, 'Recent daily gain'], [G2, 'Uniformity'], [G2, 'EPEF', 'Broiler'],
    [G3, 'Feed per bird per day'], [G3, 'Feed against standard'], [G3, 'Feed per bird to date'],
    [G3, 'Feed per dozen eggs', 'Layer'], [G3, 'FCR, kg feed per kg egg', 'Layer'],
    [G3, 'FCR, feed per kg of bird', 'Broiler'], [G3, 'Water per bird per day'],
    [G3, 'Water to feed ratio'], [G3, 'Feed stock left'], [G3, 'Stocking density'],
    [G4, 'Laying rate, hen-day', 'Layer'], [G4, 'Laying rate against standard', 'Layer'],
    [G4, 'Broken eggs', 'Layer'], [G4, 'Egg mass per hen per day', 'Layer'], [G4, 'Eggs per hen housed', 'Layer'],
    [G5, 'Cost per egg', 'Layer'], [G5, 'Feed cost per dozen', 'Layer'], [G5, 'Feed share of cost', 'Layer'],
    [G5, 'Profit per day', 'Layer'], [G5, 'Profit margin', 'Layer'],
    [G5, 'Feed cost per bird per day', 'Broiler'], [G5, 'Feed cost per kg of bird', 'Broiler'], [G5, 'Total cost per day', 'Broiler'],
    [G6, 'House temperature'], [G6, 'Humidity']
  ].map(([g, k, t]) => ({ g, k, t: t || null }));

  /* audit checks, in the order the app shows them */
  const AUDIT_ITEMS = [
    ['Biosecurity', 'Biosecurity measures in place'], ['Biosecurity', 'Rodent sightings during visit'], ['Biosecurity', 'Dead birds left in the shed'],
    ['Housing', 'House temperature'], ['Housing', 'Humidity'], ['Housing', 'Ammonia level'], ['Housing', 'Litter moisture'], ['Housing', 'Stocking density'],
    ['Feed and water', 'Feed stock on hand'], ['Feed and water', 'Feed wastage'], ['Feed and water', 'Water to feed ratio'], ['Feed and water', 'Birds per drinker'],
    ['Health', 'Vaccines given on time'], ['Health', 'Medicine withdrawal breaches'], ['Health', 'Sick birds isolated'], ['Health', 'Total mortality'],
    ['Records', 'Days of records missing, last 7'], ['Records', 'Purchases without a bill']
  ].map(([g, k]) => ({ g, k }));

  /* ---------- fields usable as formula variables ---------- */
  const FIELDS = [
    ['age', 'Flock age', 'days'], ['placed', 'Birds placed', 'birds'], ['alive', 'Birds alive today', 'birds'],
    ['mortw', 'Deaths in last 7 days', 'birds'], ['area', 'Shed floor area', 'm²'], ['temp', 'House temperature', '°C'],
    ['hum', 'Relative humidity', '%'], ['feed', 'Feed used per day', 'kg'], ['stdfeed', 'Standard feed', 'g/bird/day'],
    ['cumfeed', 'Feed eaten per bird to date', 'kg'], ['cumfeedstd', 'Standard feed to date', 'kg/bird'],
    ['water', 'Water used per day', 'litres'], ['stock', 'Feed stock on hand', 'kg'], ['price', 'Feed price per kg', 'currency'],
    ['other', 'Other costs per day', 'currency'], ['eggprice', 'Egg selling price', 'currency'],
    ['chickwt', 'Day-old chick weight', 'g'], ['wt', 'Average body weight today', 'g'], ['wtstd', 'Breed standard weight', 'g'],
    ['stdgain', 'Standard daily gain', 'g/day'], ['prevwt', 'Previous weighing', 'g'], ['prevdays', 'Days since previous weighing', 'days'],
    ['unif', 'Uniformity', '%'], ['eggs', 'Eggs per day', 'eggs'], ['broken', 'Broken eggs per day', 'eggs'],
    ['eggwt', 'Average egg weight', 'g'], ['stdlay', 'Standard laying rate', '%'], ['cumeggs', 'Total eggs laid to date', 'eggs'],
    ['bio', 'Biosecurity measures in place', 'of 6'], ['rodents', 'Rodent sightings', 'count'], ['carcass', 'Dead birds left in shed', 'birds'],
    ['nh3', 'Ammonia level', 'ppm'], ['litter', 'Litter moisture', '%'], ['waste', 'Feed wastage', '%'], ['bpd', 'Birds per drinker', 'birds'],
    ['vdue', 'Vaccine doses due', 'doses'], ['vdone', 'Vaccine doses given', 'doses'], ['wdraw', 'Withdrawal breaches', 'count'],
    ['sick', 'Sick birds seen', 'birds'], ['isol', 'Sick birds isolated', 'birds'], ['gaps', 'Days of records missing', 'days'], ['nobill', 'Purchases without a bill', 'count']
  ].map(([k, l, u]) => ({ k, l, u }));

  /* ---------- baseline (threshold) registry ---------- */
  const bird = (d, x) => num(d.wt) > 0 ? x / (num(d.wt) / 1000) : null;
  const eggK = div => (d, x) => num(d.eggwt) > 0 ? x / div / (num(d.eggwt) / 1000) : null;
  const KB = [
    { g: G1, k: 'Total mortality', dir: 'max', u: ' %', d: { Broiler: [4, 7], Layer: [5, 8] } },
    { g: G1, k: 'Livability', dir: 'min', u: ' %', d: { Broiler: [96, 93], Layer: [95, 92] } },
    { g: G1, k: 'Deaths in the last 7 days', dir: 'max', u: ' %', d: { x: [.5, 1] } },
    { g: G2, k: 'Weight against standard', dir: 'min', u: ' %', d: { x: [95, 90] } },
    { g: G2, k: 'Daily gain, whole life', dir: 'min', u: ' % of standard', d: { x: [95, 90] } },
    { g: G2, k: 'Uniformity', dir: 'min', u: ' %', d: { x: [80, 70] } },
    { g: G2, t: 'Broiler', k: 'EPEF', dir: 'min', u: '', d: { x: [300, 250] } },
    { g: G3, k: 'Feed per bird per day', dir: 'band', u: ' % of standard', d: { x: [95, 105, 90, 110] } },
    { g: G3, k: 'Feed per bird to date', dir: 'band', u: ' % of standard', d: { x: [95, 105, 90, 110] } },
    { g: G3, t: 'Layer', k: 'Feed per dozen eggs', dir: 'max', u: ' kg', d: { x: [1.6, 1.9] } },
    { g: G3, t: 'Layer', k: 'FCR, kg feed per kg egg', dir: 'max', u: ' kg feed per kg egg', d: { x: [2.3, 2.7] } },
    { g: G3, t: 'Broiler', k: 'FCR, feed per kg of bird', dir: 'max', u: ' kg feed per kg bird', d: { x: [1.8, 2.1] } },
    { g: G3, k: 'Water per bird per day', dir: 'band', u: ' ml', d: null, kg: { u: ' ml per kg of bird', f: bird } },
    { g: G3, k: 'Water to feed ratio', dir: 'band', u: ' : 1', d: { x: [1.8, 2.4, 1.5, 2.8] } },
    { g: G3, k: 'Feed stock left', dir: 'min', u: ' days', d: { x: [7, 3] } },
    { g: G3, k: 'Stocking density', dir: 'max', u: ' birds/m²', d: { Broiler: [10, 12], Layer: [7, 9] } },
    { g: G4, t: 'Layer', k: 'Laying rate, hen-day', dir: 'min', u: ' %', d: { x: [80, 65] } },
    { g: G4, t: 'Layer', k: 'Laying rate against standard', dir: 'min', u: ' %', d: { x: [95, 90] } },
    { g: G4, t: 'Layer', k: 'Broken eggs', dir: 'max', u: ' %', d: { x: [2, 4] } },
    { g: G4, t: 'Layer', k: 'Egg mass per hen per day', dir: 'min', u: ' g', d: { x: [48, 40] } },
    { g: G5, t: 'Broiler', k: 'Feed cost per bird per day', dir: 'max', u: '¤', d: null, kg: { u: '¤ per kg of bird', f: bird } },
    { g: G5, t: 'Broiler', k: 'Feed cost per kg of bird', dir: 'max', u: '¤', d: null },
    { g: G5, t: 'Broiler', k: 'Total cost per day', dir: 'max', u: '¤', d: null },
    { g: G5, t: 'Layer', k: 'Cost per egg', dir: 'max', u: '¤', d: null, kg: { u: '¤ per kg of egg', f: eggK(1) } },
    { g: G5, t: 'Layer', k: 'Feed cost per dozen', dir: 'max', u: '¤', d: null, kg: { u: '¤ per kg of egg', f: eggK(12) } },
    { g: G5, t: 'Layer', k: 'Feed share of cost', dir: 'band', u: ' %', d: { x: [55, 72, 45, 80] } },
    { g: G5, t: 'Layer', k: 'Profit margin', dir: 'min', u: ' %', d: { x: [15, 0] } },
    { g: G6, k: 'House temperature', dir: 'band', u: ' °C', ub: { Broiler: ' °C from target', Layer: ' °C' }, d: { Layer: [18, 27, 15, 30], Broiler: [-2, 2, -4, 4] } },
    { g: G6, k: 'Humidity', dir: 'band', u: ' %', d: { x: [50, 70, 40, 80] } },
    { g: GA, k: 'Biosecurity measures in place', dir: 'min', u: ' of 6', d: { x: [5, 3] } },
    { g: GA, k: 'Rodent sightings during visit', dir: 'max', u: '', d: { x: [0, 2] } },
    { g: GA, k: 'Dead birds left in the shed', dir: 'max', u: '', d: { x: [0, 2] } },
    { g: GA, k: 'Ammonia level', dir: 'max', u: ' ppm', d: { x: [10, 25] } },

const DIRS={none:'No colour, just show the number',max:'Lower is better',min:'Higher is better',band:'Best between two limits'};
const dirSum=k=>k.dir==='none'||!k.t?'No limits':FV.btxt(k.dir,k.t,k.unit==='¤'?'¤':k.unit?' '+k.unit:'');
function pKpis(){
  return`<h1>Your own metrics</h1><p class="lead">Combine any figures into a new reading with a formula, and say what good looks like. They show in Live readings, the report and the PDF, and they are averaged across farms on the Overview.</p>
  <div class="row" style="margin-bottom:14px"><button class="btn pri" data-act="knew">Add a metric</button></div>
  ${CFG.kpis.length?`<div class="items">${CFG.kpis.map((k,i)=>`<div class="card it"><div><b>${esc(k.label)}</b> <span class="pill">${esc(k.group)}</span>${k.off?' <span class="pill warn">Not in form</span>':''}<div class="m"><code>${esc(k.formula)}</code></div><div class="m">${k.unit?'In '+esc(k.unit)+' · ':''}${esc(dirSum(k))} · ${appliesTxt(k.types)}</div></div><div class="row"><button class="btn sm" data-act="kedit" data-i="${i}">Edit</button><button class="btn sm bad" data-act="kdel" data-i="${i}">Delete</button></div></div>`).join('')}</div>`:'<div class="card empty"><b>No custom metrics yet</b>For example: “Empty cage share” as <code class="fx">cf_cages / placed * 100</code>.</div>'}`;
}
function kpiDlg(i){
  const ed=i>=0?CFG.kpis[i]:null,k=ed||{label:'',formula:'',unit:'',dec:1,dir:'none',t:null,group:GC,types:TYPES.slice()};
  const vars=FV.formulaVars(CFG);
  const groups=[...new Set([G1,G2,G3,G4,G5,G6,GC].concat(CFG.kpis.map(x=>x.group)))];
  const body=`<label class="f"><span>Metric name</span><input id="k_l" maxlength="60" value="${esc(k.label)}" placeholder="For example: Empty cage share"></label>
  <label class="f"><span>Formula</span><textarea id="k_f" rows="2" maxlength="400" spellcheck="false" style="font-family:ui-monospace,Menlo,monospace" placeholder="cf_cages / placed * 100">${esc(k.formula)}</textarea><small>Use + - * / ( ) and the functions min, max, abs, sqrt, round(x, n), pct(a, b), avg(a, b, ...), if(test, a, b). A result is shown only when every figure used has been entered.</small></label>
  <details><summary class="lnk" style="display:inline-block">Insert a figure</summary><input id="k_vs" placeholder="Search figures" style="margin:8px 0"><div class="vars" id="k_v"></div></details>
  <div class="res" id="k_res" aria-live="polite">Type a formula to test it.</div><div class="try" id="k_try"></div>
  <div class="g2" style="margin-top:14px"><label class="f"><span>Unit</span><input id="k_u" maxlength="24" value="${esc(k.unit)}" placeholder="%, kg, birds"><small>Type ¤ alone to show your currency.</small></label><label class="f"><span>Decimals</span><select id="k_d">${[0,1,2,3,4].map(n=>`<option ${k.dec===n?'selected':''}>${n}</option>`).join('')}</select></label></div>
  <div class="g2"><label class="f"><span>Group in Live readings</span><input id="k_g" maxlength="40" list="k_gl" value="${esc(k.group)}"><datalist id="k_gl">${groups.map(g=>`<option value="${esc(g)}">`).join('')}</datalist></label>
  <label class="f"><span>What is good?</span><select id="k_dir">${Object.keys(DIRS).map(d=>`<option value="${d}" ${k.dir===d?'selected':''}>${DIRS[d]}</option>`).join('')}</select></label></div>
  <div class="row" id="k_lim" style="align-items:flex-end;gap:10px"></div>
  <div style="margin:10px 0 4px"><span class="chk">Applies to</span>${TYPES.map(t=>`<label class="chk"><input type="checkbox" class="k_ty" value="${t}" ${(k.types||TYPES).includes(t)?'checked':''}> ${t}</label>`).join('')}</div>`;
  return dlg(ed?'Edit metric':'Add a metric',body,{wide:true,ok:ed?'Save metric':'Add metric',
    init:d=>{
      const f=$('#k_f',d),tr=$('#k_try',d),res=$('#k_res',d),tv={};
      const drawVars=()=>{const q=$('#k_vs',d).value.toLowerCase();$('#k_v',d).innerHTML=vars.filter(v=>!q||(v.k+v.l).toLowerCase().includes(q)).map(v=>`<button type="button" data-v="${v.k}" title="${esc(v.l+(v.u?' ('+v.u+')':''))}">${v.k}</button>`).join('')};
      drawVars();$('#k_vs',d).oninput=drawVars;
      $('#k_v',d).onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;const s=f.selectionStart,t=f.selectionEnd;f.setRangeText(b.dataset.v,s,t,'end');f.focus();calc(true)};
      const names=Object.fromEntries(vars.map(v=>[v.k,v]));
      function calc(redraw){
        const src=f.value.trim();
        if(!src){res.textContent='Type a formula to test it.';tr.innerHTML='';return}
        let ast;try{ast=FV.parse(src)}catch(e){res.textContent='Formula problem: '+e.message;tr.innerHTML='';return}
        const used=[...FV.vars(ast)],bad=used.filter(v=>!names[v]);
        if(bad.length){res.textContent='Unknown figure: '+bad.join(', ')+'. Pick from “Insert a figure”.';tr.innerHTML='';return}
        if(redraw!==false&&used.join()!==tr.dataset.used){tr.dataset.used=used.join();tr.innerHTML=used.map(v=>`<label>${esc(names[v].l)} <code>${v}</code><input inputmode="decimal" data-tv="${v}" value="${tv[v]==null?'':tv[v]}" placeholder="try a value"></label>`).join('')}
        used.forEach(v=>{const x=tr.querySelector('[data-tv="'+v+'"]');if(x)tv[v]=x.value});
        const out=FV.evalCustom({formula:src},n=>{const x=parseFloat(String(tv[n]==null?'':tv[n]).replace(',','.'));return isFinite(x)?x:null});
        res.textContent=out==null?'Fill the try-out values to see a result. Empty or divide by zero shows a dash.':'With these values: '+fmt(out,+$('#k_d',d).value)+(unitTxt($('#k_u',d).value)?' '+unitTxt($('#k_u',d).value):'');
      }
      f.oninput=()=>calc(true);tr.oninput=()=>calc(false);$('#k_d',d).onchange=()=>calc(false);$('#k_u',d).oninput=()=>calc(false);
      const lim=()=>{const dir=$('#k_dir',d).value,names=dir==='band'?['Good from','Good to','Poor below','Poor above']:dir==='max'?['Good up to','Poor above']:dir==='min'?['Good from','Poor below']:[];
        const cur=[...$$('[data-kt]',d)].map(x=>x.value);const src=cur.length===names.length&&cur.some(Boolean)?cur:(k.t&&k.dir===dir?k.t:[]);
        $('#k_lim',d).innerHTML=names.map((n,j)=>`<label class="f" style="margin:0"><span>${n}</span><input data-kt inputmode="decimal" style="width:110px" value="${src[j]==null?'':src[j]}"></label>`).join('');};
      $('#k_dir',d).onchange=lim;lim();calc(true);
    },
    onOk:d=>{
      const label=$('#k_l',d).value.trim(),formula=$('#k_f',d).value.trim(),dir=$('#k_dir',d).value;
      if(!label)throw new Error('Give the metric a name.');if(!formula)throw new Error('Write a formula.');
      const types=$$('.k_ty:checked',d).map(x=>x.value);if(!types.length)throw new Error('Choose broiler, layer or both.');
      const o={id:ed?ed.id:slug(label,'ck_',new Set(CFG.kpis.map(x=>x.id))),label,formula,unit:$('#k_u',d).value.trim(),dec:+$('#k_d',d).value,dir,group:$('#k_g',d).value.trim()||GC,types};
      if(dir!=='none')o.t=$$('[data-kt]',d).map(x=>x.value.trim()===''?NaN:+x.value.replace(',','.'));
      const t=clone(CFG);if(ed)t.kpis[i]=o;else t.kpis.push(o);
      const r=FV.validateConfig(t);if(!r.ok)throw new Error(r.errors[0]);
      CFG=r.config;mark();render();
    }});
}

  <h2>Links for your team</h2><div class="card pad" style="max-width:560px"><p class="hint" style="margin-top:0">Each link already knows where your sheet is, so people only sign in. Send the form link to auditors and the reports link to anyone who only reads.</p>
  ${[['Visit form (auditors)','index.html'],['Reports (viewers)','reports.html']].map(([n,p])=>'<label class="f"><span>'+n+'</span><input readonly value="'+esc(FVR.shareLink(p))+'" onfocus="this.select()"></label>').join('')}</div>
  <h2>Recent activity</h2>${AUDLOG?`<div class="card tw"><table><tbody>${AUDLOG.map(a=>`<tr><td style="white-space:nowrap">${ft(a.at)}</td><td><b>${esc(a.userName||'')}</b></td><td>${esc(a.action)}</td><td>${esc(a.detail||'')}</td></tr>`).join('')||'<tr><td class="hint">Nothing yet.</td></tr>'}</tbody></table></div>`:'<p class="hint">Loading…</p>'}`;
}

/* ---------- router ---------- */
const PAGES=[['overview','Overview',pOverview],['visits','All visits',pVisits],['metrics','Metrics',pMetrics],['allkpis','All KPIs',pAll],['fields','Custom fields',pFields],['kpis','Custom metrics',pKpis],['farms','Farms',pFarms],['team','Team',pTeam],['org','Organisation',pOrg]];
const cur=()=>{const h=(location.hash||'#overview').slice(1);return PAGES.some(p=>p[0]===h)?h:'overview'};
async function ensure(p){
  try{
    if(p==='overview'&&!OV){OV=await api('GET','/api/admin/overview');render()}
    if(p==='visits'&&!VIS){await loadVisits();render()}
    if(p==='farms'&&!FARMS.length){await loadFarms();render()}
    if(p==='team'&&!USERS.length){await loadUsers();render()}
    if(p==='org'&&!AUDLOG){AUDLOG=await api('GET','/api/admin/audit');render()}
  }catch(e){if(e.message!=='auth')toast(e.message)}
}
function render(){
  const p=cur();
  $('#nav').innerHTML=`<div class="brand"><svg viewBox="0 0 100 114" aria-hidden="true"><path d="M50 4C73 4 91 38 91 66C91 90 73 110 50 110C27 110 9 90 9 66C9 38 27 4 50 4Z" fill="none" stroke="currentColor" stroke-width="8"/><circle cx="50" cy="70" r="26" fill="#f4b324"/></svg><div><b>Farm Visit</b><small>${esc(ORG.name)}</small></div></div>`+PAGES.map(x=>`<a class="nv" href="#${x[0]}" ${x[0]===p?'aria-current="page"':''}>${x[1]}</a>`).join('')+`<div class="sp"></div><div class="me"><b>${esc(ME.name)}</b>${ROLE[ME.role]}<br><a href="index.html">Visit form</a><a href="reports.html">Reports</a><a href="#" data-act="out">Sign out</a></div>`;
  $('#top').innerHTML=`<span><b>${esc(ORG.name)}</b></span><span><a href="index.html">Visit form</a> · <a href="reports.html">Reports</a> · <a href="#" data-act="out">Sign out</a></span>`;
  const keep=document.activeElement&&document.activeElement.id,pos=keep?document.activeElement.selectionStart:null;
  $('#view').innerHTML=PAGES.find(x=>x[0]===p)[2]();
  if(keep){const el=document.getElementById(keep);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}}
}
window.addEventListener('hashchange',()=>{render();ensure(cur());window.scrollTo(0,0)});

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,i=+b.dataset.i,id=b.dataset.id;
  try{switch(a){
    case'out':e.preventDefault();try{await api('POST','/api/auth/logout')}catch(_){}FVR.loggedOut();break;
    case'ty':ty=b.dataset.t;render();break;
    case'lim':{const k=b.dataset.id;openLim.has(k)?openLim.delete(k):openLim.add(k);render();break}
    case'limreset':{const key=ty+'|'+b.dataset.k;delete CFG.baselines[key];mark();render();break}
    case'allon':case'alloff':allRows().forEach(r=>rowSet(r,b.dataset.t,a==='allon'));mark();render();break;
    case'fnew':fieldDlg(-1);break;case'fedit':fieldDlg(i);break;
    case'fup':case'fdn':{const j=a==='fup'?i-1:i+1,f=CFG.fields;[f[i],f[j]]=[f[j],f[i]];mark();render();break}
    case'fdel':{const f=CFG.fields[i],u=usedIn(f.id);if(u.length){toast('“'+f.label+'” is used by the metric “'+u[0].label+'”. Change or delete that metric first.');break}
      if(await confirmDlg('Delete this field?','“'+esc(f.label)+'” will no longer be asked. Answers already saved on past visits are kept.','Delete')){CFG.fields.splice(i,1);mark();render()}break}
    case'knew':kpiDlg(-1);break;case'kedit':kpiDlg(i);break;
    case'kdel':if(await confirmDlg('Delete this metric?','“'+esc(CFG.kpis[i].label)+'” disappears from the app and reports. Saved visits keep their figures.','Delete')){CFG.kpis.splice(i,1);mark();render()}break;
    case'fnew2':farmDlg(null);break;case'fedit2':farmDlg(id);break;case'fimport':importDlg();break;
    case'farch':if(await confirmDlg('Archive this farm?','It leaves the farm list in the app. Its past visits stay.','Archive')){await api('DELETE','/api/farms/'+id);await loadFarms();render()}break;
    case'frest':await api('PUT','/api/farms/'+id,{active:true});await loadFarms();render();break;
    case'unew':case'uedit':if(!FARMS.length)await loadFarms();userDlg(a==='unew'?null:id);break;
    case'ureset':{const u=USERS.find(x=>x.id===id);if(await confirmDlg('Reset password?',esc(u.name)+' is signed out and gets a new temporary password.','Reset')){const r=await api('PATCH','/api/users/'+id,{resetPassword:true});await loadUsers();render();setTimeout(()=>pwDlg('New temporary password',u.name,r.tempPassword),50)}break}
    case'utog':{const u=USERS.find(x=>x.id===id);await api('PATCH','/api/users/'+id,{active:!u.active});await loadUsers();render();toast(u.active?'Deactivated':'Reactivated');break}
    case'vdel':if(await confirmDlg('Delete this visit?','The report and its readings are removed for everyone. This cannot be undone.','Delete')){await api('DELETE','/api/visits/'+id);await loadVisits();OV=null;render()}break;
    case'vmore':visMax+=200;render();break;
    case'sheet':{const r=await api('GET','/api/admin/sheet');window.open(r.url,'_blank','noopener');break}
    case'kisheet':case'kpisheet':{const r=await api('POST','/api/admin/rebuild-kpi-sheet',{});toast('Updated: '+r.rows+' readings written to the “KPI readings” tab');break}
    case'dbdl':LOCAL.downloadDb();break;
    case'dbwipe':if(await confirmDlg('Erase everything?','All organisations, farms, visits and users in this browser are deleted. Download the database file first if you may need it.','Erase')){await LOCAL.wipe();LOCAL.nav('/login')}break;
    case'osave':{const r=await api('PUT','/api/org',{name:$('#o_n').value,currency:$('#o_c').value,language:$('#o_l').value,selfSignup:$('#o_s').value==='on'});ORG=r;CUR=r.currency;AUDLOG=null;render();ensure('org');toast('Saved');break}
  }}catch(x){if(x.message!=='auth')toast(x.message)}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  try{
    if(t.matches('[data-tg]')){
      const list=t.dataset.tg==='kpi'?CFG.disabled[ty]:CFG.disabled.audit,k=t.dataset.k;
      const i=list.indexOf(k);if(t.checked){if(i>=0)list.splice(i,1)}else if(i<0)list.push(k);
      mark();render();
    }else if(t.matches('[data-ak]')){
      const r=allRows().find(x=>x.kind===t.dataset.ak&&(x.kind==='custom'?x.id:x.k)===t.dataset.k);if(r){rowSet(r,t.dataset.t,t.checked);mark();render()}
    }else if(t.id==='ak'){allKind=t.value;render()}
    else if(t.matches('[data-lim]'))limChange(t);
    else if(t.matches('[data-kg]')){const key=ty+'|'+t.dataset.kg,o=CFG.baselines[key]||{};o.kg=t.checked;CFG.baselines[key]=o;if(!o.kg&&!o.v&&!o.vk)delete CFG.baselines[key];mark();render()}
    else if(t.matches('[data-role]')){await api('PATCH','/api/users/'+t.dataset.role,{role:t.value});await loadUsers();render();toast('Role changed')}
    else if(t.id==='farch'){showArch=t.checked;render()}
    else if(t.id==='dbup'&&t.files[0]){const buf=new Uint8Array(await t.files[0].arrayBuffer());if(await confirmDlg('Replace this database?','Everything in this browser is replaced by the contents of that file. You will be signed out.','Replace')){await LOCAL.importDb(buf);LOCAL.nav('/login')}}
  }catch(x){if(x.message!=='auth'){toast(x.message);if(t.matches('[data-role]')){await loadUsers();render()}}}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='fq'){farmQ=t.value;render()}
  else if(t.id==='aq'){allQ=t.value;render()}
  else if(t.id==='vq'){visQ=t.value;visMax=100;render()}
});
$('#discard').onclick=()=>{CFG=JSON.parse(snapshot);mark();render()};
$('#save').onclick=async()=>{
  const b=$('#save');b.disabled=true;
  try{
    const r=await api('PUT','/api/config',{config:CFG,version:VER});
    VER=r.version;CFG=Object.assign({},r);delete CFG.version;snapshot=JSON.stringify(CFG);mark();render();toast('Saved. The visit app picks this up on its next load.');
  }catch(e){
    if(e.status===409){toast('Someone else changed these settings. Reloading…');setTimeout(()=>location.reload(),1500)}
    else if(e.message!=='auth')toast(e.message);
  }
  b.disabled=false;
};

/* ---------- start ---------- */
(async function init(){
  try{
    const b=await api('GET','/api/bootstrap');
    ME=b.user;ORG=b.org;CUR=ORG.currency;VER=b.config.version;CFG=Object.assign({},b.config);delete CFG.version;
    CFG.disabled=Object.assign({Broiler:[],Layer:[],audit:[]},CFG.disabled);CFG.baselines=CFG.baselines||{};CFG.fields=CFG.fields||[];CFG.kpis=CFG.kpis||[];
    snapshot=JSON.stringify(CFG);
    if(ME.role==='auditor'||ME.role==='viewer'){location.href=FVR.home(ME.role);return}
    FARMS=[];
    render();ensure(cur());
  }catch(e){if(e.message!=='auth')$('#view').innerHTML='<p class="hint">Could not load the admin panel: '+esc(e.message)+'</p>'}
})();
})();
</script>
<script src="tour.js" defer></script>
</body>
</html>
